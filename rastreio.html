<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acompanhe seu pedido | Lumos</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <script src="js/logo.js?v=96" defer></script>
  <link rel="stylesheet" href="css/styles.css?v=96" />
  <script src="js/dialogs.js?v=96"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>
  <style>
    body { margin:0; background:var(--panel-bg, #0c0c0c); color:var(--panel-text, #f3efe6); font-family:var(--panel-font-body, system-ui); }
    .mb { max-width:560px; margin:0 auto; padding:18px 16px 60px; }
    .mb-topo { display:flex; align-items:center; gap:10px; } .mb-topo img { width:34px; height:34px; }
    .mb-card { background:var(--panel-card, #17161a); border:1px solid var(--panel-border, #2a2a2e); border-radius:18px; padding:16px; margin-top:14px; }
    .mb-card h3 { font-size:18px; margin:0 0 6px; } .mb-card p { margin:6px 0; font-size:14.5px; line-height:1.5; }
    .mb-btn { display:block; width:100%; border:0; border-radius:14px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px; text-align:center; text-decoration:none; font-family:inherit; }
    .mb-ok { background:#C9A84C; color:#1C1508; } .mb-sec { background:rgba(127,127,127,.18); color:inherit; } .mb-nao { background:rgba(185,64,64,.16); color:#e06666; }
    .mb-dois { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .mb-dois .mb-btn { margin-top:10px; }
    .mb-tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700; background:rgba(201,168,76,.18); }
    .mb-cobrar { background:rgba(212,131,74,.15); border:1px solid rgba(212,131,74,.5); border-radius:12px; padding:10px 12px; margin-top:8px; font-weight:700; }
    .mb-gps { display:flex; align-items:center; gap:8px; font-size:14px; } .mb-gps i { width:10px; height:10px; border-radius:50%; background:#B94040; } .mb-gps.on i { background:#4A7C59; box-shadow:0 0 0 4px rgba(74,124,89,.25); }
    .mb-vazio { text-align:center; opacity:.75; padding:30px 10px; }
    select.mb-sel { width:100%; padding:12px; border-radius:12px; margin-top:8px; font-size:15px; }
  </style>
  <style>
    .rs-passos { display:flex; justify-content:space-between; gap:6px; margin-top:12px; }
    .rs-passos div { flex:1; text-align:center; font-size:12.5px; opacity:.5; } .rs-passos div.on { opacity:1; font-weight:700; }
    .rs-passos b { display:block; font-size:22px; margin-bottom:4px; }
    #rs-mapa { height:52vh; border-radius:18px; margin-top:14px; border:1px solid var(--panel-border, #2a2a2e); }
  </style>
  <div class="mb">
    <div class="mb-topo"><img src="img/logo.png" alt="" /><b>Acompanhe seu pedido</b></div>
    <div class="mb-card" id="rs-card"><p class="mb-vazio">Carregando...</p></div>
    <div id="rs-mapa" style="display:none;"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module">
    import { supabase } from "./js/supabaseClient.js?v=96";
    const r = new URLSearchParams(location.search).get("r") || "";
    let mapa = null, marcador = null;
    async function atualizar() {
      const { data, error } = await supabase.functions.invoke("entregas", { body: { action: "rastreio", r } });
      let erro = data?.error; if (error && !erro) { try { erro = (await error.context.json()).error; } catch (_) { erro = "Sem conexão. Tentando de novo..."; } }
      const card = document.getElementById("rs-card");
      if (erro) { card.innerHTML = `<h3>${erro}</h3>`; document.getElementById("rs-mapa").style.display = "none"; return; }
      const passo = { aguardando_entregador: 0, oferecida: 0, em_rota: 1, chegou: 2, entregue: 3, retirado: 3 }[data.etapa] ?? 0;
      const titulo = ["Seu pedido está quase saindo", `${data.entregador?.nome || "O entregador"} está a caminho`, `${data.entregador?.nome || "O entregador"} chegou!`, "Pedido entregue. Bom apetite! 😋"][passo];
      card.innerHTML = `<h3>Pedido #${data.numero}</h3><p>${titulo}</p>
        <div class="rs-passos">${["🍳 Pronto", "🛵 A caminho", "📍 Chegou", "✅ Entregue"].map((t, i) => `<div class="${i <= passo ? "on" : ""}"><b>${t.split(" ")[0]}</b>${t.split(" ").slice(1).join(" ")}</div>`).join("")}</div>`;
      const el = document.getElementById("rs-mapa");
      if (data.posicao && window.L && passo < 3) {
        el.style.display = "";
        const pos = [data.posicao.lat, data.posicao.lng];
        if (!mapa) { mapa = L.map("rs-mapa").setView(pos, 15); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(mapa); }
        const icone = L.divIcon({ className: "", html: `<div style="font-size:30px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));">🛵</div>`, iconSize: [34, 34], iconAnchor: [17, 17] });
        if (marcador) marcador.setLatLng(pos); else marcador = L.marker(pos, { icon: icone }).addTo(mapa);
        mapa.panTo(pos);
      } else el.style.display = "none";
    }
    atualizar();
    setInterval(atualizar, 10000);
  </script>
</body>
</html>

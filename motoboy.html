<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas entregas | Lumos</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <script src="js/logo.js?v=96" defer></script>
  <link rel="stylesheet" href="css/styles.css?v=96" />
  <script src="js/dialogs.js?v=96"></script>
</head>
<body>

  <div class="dash-shell">

    <main class="dash-main">
      <div class="mb" id="mb-raiz" style="max-width:640px; padding:0;"></div>
    </main>
  </div>
  <script type="module">
    import { requireSession, signOut } from "./js/auth.js?v=96";
    import { initThemeToggle } from "./js/theme.js?v=96";
    import { initMobileNav } from "./js/mobileNav.js?v=96";
    import { renderSidebar } from "./js/sidebar.js?v=96";
    import { MARCACAO, iniciarMotoboy } from "./js/motoboyTela.js?v=96";
    await requireSession();
    initThemeToggle();
    await renderSidebar("entregas");
    initMobileNav();
    document.getElementById("logout-link")?.addEventListener("click", (e) => { e.preventDefault(); signOut(); });
    document.getElementById("mb-raiz").innerHTML = MARCACAO;
    iniciarMotoboy();
  </script>
</body>
</html>

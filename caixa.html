<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caixa | Lumos</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <script src="js/logo.js?v=87" defer></script>
  <link rel="stylesheet" href="css/styles.css?v=87" />
  <script src="js/dialogs.js?v=87"></script>
  <style>
    .cx-card { background:var(--panel-card); border:1px solid var(--panel-border); border-radius:14px; padding:20px; margin-top:16px; }
    .cx-card h3 { font-size:16px; }
    .cx-hint { font-size:12.5px; color:var(--panel-text-muted); line-height:1.55; }
    .cx-num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .panel-table th.cx-num { text-align:right; }
    .panel-table tbody tr { cursor:default; }
    .cx-tot td { font-weight:700; background:var(--panel-accent-light); }
    .cx-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .cx-badge { display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid; }
    .cx-badge.ok { color:#4A7C59; border-color:rgba(74,124,89,.4); } .cx-badge.err { color:#B94040; border-color:rgba(185,64,64,.4); } .cx-badge.muted { color:var(--panel-text-muted); border-color:var(--panel-border); }
    .cx-fecha { display:grid; grid-template-columns: minmax(0,1fr) 120px 130px 110px; gap:8px; align-items:center; font-size:14px; }
    .cx-fecha input { width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--panel-border); background:var(--panel-bg); color:var(--panel-text); text-align:right; }
    .cx-fecha .h { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--panel-text-muted); }
    .cx-pos { color:#4A7C59; } .cx-neg { color:#B94040; }
    @media (max-width:560px) { .cx-fecha { grid-template-columns: minmax(0,1fr) 92px 104px; } .cx-fecha .d { display:none; } }
  </style>
</head>
<body>

  <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>

  <div class="luzes luzes--panel" aria-hidden="true">
    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
  </div>

  <div class="dash-shell">
    <aside class="dash-side">
      <div class="logo">
        <img src="img/logo.png" class="logo-mark" alt="Lumos">
        Lumos
      </div>
      <nav class="dash-nav" id="dash-nav"></nav>
      <button class="theme-toggle-btn" id="theme-toggle-btn">
        <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"></svg>
        <span id="theme-toggle-label">Modo escuro</span>
      </button>
    </aside>

    <main class="dash-main">
      <div>
        <h1 style="font-size: 28px;">Caixa</h1>
        <p style="margin-top: 6px;">Abertura com fundo de troco, sangria, suprimento e fechamento conferindo cada forma de pagamento.</p>
      </div>
      <div id="atual"><p class="cx-hint" style="margin-top:16px;">Carregando...</p></div>
      <h3 class="erp-section-title">Caixas anteriores</h3>
      <div class="panel-table-wrap" style="margin-top:6px;">
        <table class="panel-table">
          <thead><tr><th>Nº</th><th>Aberto</th><th>Fechado</th><th>Operador</th><th class="cx-num">Vendas</th><th class="cx-num">Diferença</th><th></th></tr></thead>
          <tbody id="hist"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js?v=87";
    import { initThemeToggle } from "./js/theme.js?v=87";
    import { initMobileNav } from "./js/mobileNav.js?v=87";
    import { renderSidebar } from "./js/sidebar.js?v=87";
    import { supabase } from "./js/supabaseClient.js?v=87";
    import { brl, esc, ownerId, modal, buscarTodos } from "./js/erp.js?v=87";
    import { resumoCaixa, FORMAS_CAIXA } from "./js/caixa.js?v=87";

    await requireSession();
    initThemeToggle();
    await renderSidebar("caixa");
    initMobileNav();
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); signOut(); });
    const owner_id = await ownerId();
    const { getMyAccess } = await import("./js/workspace.js?v=87");
    const acesso = await getMyAccess().catch(() => ({}));
    const { data: u } = await supabase.auth.getUser();
    const eu = { id: u?.user?.id || null, nome: acesso?.member?.nome || u?.user?.email || "Responsável" };
    const $ = (id) => document.getElementById(id);
    const hora = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });

    async function vendasEntre(ini, fim) {
      const out = await buscarTodos(() => {
        let q = supabase.from("sales_orders").select("id, numero, paid_at, total, pagamento, simulado").eq("owner_id", owner_id).eq("status", "pago").gte("paid_at", ini);
        if (fim) q = q.lte("paid_at", fim);
        return q.order("paid_at");
      });
      return out.filter((v) => !v.simulado);
    }

    let caixa = null, movs = [], vendas = [], resumo = null;
    async function load() {
      const [{ data: abertos }, { data: hist }] = await Promise.all([
        supabase.from("caixas").select("*").eq("owner_id", owner_id).eq("status", "aberto").limit(1),
        supabase.from("caixas").select("*").eq("owner_id", owner_id).eq("status", "fechado").order("fechado_em", { ascending: false }).limit(30),
      ]);
      caixa = abertos?.[0] || null;
      if (caixa) {
        const [{ data: m }, v] = await Promise.all([
          supabase.from("caixa_movs").select("*").eq("caixa_id", caixa.id).order("created_at"),
          vendasEntre(caixa.aberto_em, null),
        ]);
        movs = m || []; vendas = v;
        resumo = resumoCaixa({ valorInicial: caixa.valor_inicial, vendas, movs });
      }
      renderAtual();
      $("hist").innerHTML = (hist || []).map((c) => {
        const tot = Object.values(c.esperado?.formas || {}).reduce((t, f) => t + Number(f.valor || 0), 0);
        const dif = Number(c.diferenca || 0);
        return `<tr><td>#${c.numero}</td><td>${hora(c.aberto_em)}</td><td>${hora(c.fechado_em)}</td><td>${esc(c.fechado_por_nome || c.aberto_por_nome || "-")}</td>
          <td class="cx-num">${brl(tot)}</td><td class="cx-num ${dif > 0 ? "cx-pos" : dif < 0 ? "cx-neg" : ""}">${dif === 0 ? "sem diferença" : brl(dif)}</td>
          <td><button class="btn btn-ghost" style="padding:6px 12px; font-size:13px;" data-rel="${c.id}">Relatório</button></td></tr>`;
      }).join("") || `<tr><td colspan="7" style="opacity:.7;">Nenhum caixa fechado ainda.</td></tr>`;
      window.__hist = hist || [];
    }

    function renderAtual() {
      const box = $("atual");
      if (!caixa) {
        box.innerHTML = `<div class="cx-card"><h3>Caixa fechado</h3>
          <p class="cx-hint" style="margin-top:4px;">Abra o caixa no começo do turno, informando o dinheiro que fica na gaveta para troco.</p>
          <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:12px;">
            <div class="field" style="margin:0;"><label>Fundo de troco (R$)</label><input id="a-ini" type="number" step="0.01" min="0" value="0" style="max-width:180px;" /></div>
            <button class="btn btn-primary" id="b-abrir">Abrir caixa</button>
          </div></div>`;
        $("b-abrir").addEventListener("click", abrir);
        return;
      }
      const r = resumo;
      box.innerHTML = `<div class="cx-card">
        <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
          <div><h3>Caixa #${caixa.numero} aberto</h3><p class="cx-hint">Desde ${hora(caixa.aberto_em)}, por ${esc(caixa.aberto_por_nome || "-")}. Fundo de troco: ${brl(caixa.valor_inicial)}.</p></div>
          <span class="cx-badge ok">Aberto</span>
        </div>
        <div class="panel-stat-grid" style="margin-top:12px;">
          <div class="panel-stat-card"><div><div class="label">Vendas no caixa</div><div class="value">${brl(r.totalVendas)}</div></div></div>
          <div class="panel-stat-card"><div><div class="label">Quantidade de vendas</div><div class="value">${r.qtdVendas}</div></div></div>
          <div class="panel-stat-card"><div><div class="label">Dinheiro na gaveta (esperado)</div><div class="value">${brl(r.dinheiroGaveta)}</div></div></div>
        </div>
        <div class="panel-table-wrap" style="margin-top:14px;"><table class="panel-table"><thead><tr><th>Forma de pagamento</th><th class="cx-num">Vendas</th><th class="cx-num">Total</th></tr></thead><tbody>
          ${Object.entries(r.formas).filter(([, f]) => f.qtd).map(([k, f]) => `<tr><td>${FORMAS_CAIXA[k]}</td><td class="cx-num">${f.qtd}</td><td class="cx-num">${brl(f.valor)}</td></tr>`).join("") || `<tr><td colspan="3" style="opacity:.7;">Nenhuma venda desde a abertura.</td></tr>`}
        </tbody></table></div>
        ${movs.length ? `<div class="panel-table-wrap" style="margin-top:12px;"><table class="panel-table"><thead><tr><th>Movimento</th><th>Quando</th><th>Motivo</th><th class="cx-num">Valor</th></tr></thead><tbody>
          ${movs.map((m) => `<tr><td>${m.tipo === "sangria" ? "Sangria (retirada)" : "Suprimento (reforço)"}</td><td>${hora(m.created_at)}</td><td>${esc(m.motivo || "")}${m.por_nome ? ` <span class="cx-hint">por ${esc(m.por_nome)}</span>` : ""}</td><td class="cx-num ${m.tipo === "sangria" ? "cx-neg" : "cx-pos"}">${m.tipo === "sangria" ? "-" : "+"}${brl(m.valor)}</td></tr>`).join("")}
        </tbody></table></div>` : ""}
        <div class="cx-actions">
          <button class="btn btn-ghost" id="b-sangria">Sangria</button>
          <button class="btn btn-ghost" id="b-supri">Suprimento</button>
          <button class="btn btn-ghost" id="b-atual">Atualizar</button>
          <button class="btn btn-primary" id="b-fechar">Fechar caixa</button>
        </div>
      </div>`;
      $("b-sangria").addEventListener("click", () => movimento("sangria"));
      $("b-supri").addEventListener("click", () => movimento("suprimento"));
      $("b-atual").addEventListener("click", load);
      $("b-fechar").addEventListener("click", fechar);
    }

    async function abrir() {
      const v = Number($("a-ini").value || 0);
      if (v < 0) return lumosAlert("O fundo de troco não pode ser negativo.");
      const { error } = await supabase.from("caixas").insert({ owner_id, valor_inicial: v, aberto_por: eu.id, aberto_por_nome: eu.nome });
      if (error) return lumosAlert(/caixas_um_aberto|duplicate/.test(error.message) ? "Já existe um caixa aberto. Atualize a tela." : `Não foi possível abrir: ${error.message}`);
      load();
    }

    function movimento(tipo) {
      const m = modal(`<h3 style="font-size:18px;">${tipo === "sangria" ? "Sangria: retirar dinheiro da gaveta" : "Suprimento: colocar dinheiro na gaveta"}</h3>
        <p class="cx-hint" style="margin:4px 0 12px;">${tipo === "sangria" ? "Ex.: levar o excesso para o cofre ou pagar um fornecedor em dinheiro." : "Ex.: reforço de troco no meio do turno."}</p>
        <div class="field"><label>Valor (R$)</label><input id="m-v" type="number" step="0.01" min="0.01" /></div>
        <div class="field"><label>Motivo</label><input id="m-m" placeholder="${tipo === "sangria" ? "Ex.: cofre" : "Ex.: troco"}" /></div>
        <div id="m-msg" class="form-msg"></div>
        <div class="modal-actions"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="m-ok">Registrar</button></div>`, { width: 440 });
      m.el.querySelector("#m-ok").addEventListener("click", async () => {
        const valor = Number(m.el.querySelector("#m-v").value);
        const msg = m.el.querySelector("#m-msg");
        if (!(valor > 0)) { msg.textContent = "Informe o valor."; msg.className = "form-msg error"; return; }
        if (tipo === "sangria" && valor > resumo.dinheiroGaveta + 0.001) { msg.textContent = `A gaveta deveria ter ${brl(resumo.dinheiroGaveta)}. Confira o valor.`; msg.className = "form-msg error"; return; }
        const { error } = await supabase.from("caixa_movs").insert({ caixa_id: caixa.id, owner_id, tipo, valor, motivo: m.el.querySelector("#m-m").value.trim() || null, por: eu.id, por_nome: eu.nome });
        if (error) { msg.textContent = error.message; msg.className = "form-msg error"; return; }
        m.close(); load();
      });
    }

    async function fechar() {
      await load();
      const r = resumo;
      const linhas = Object.entries(r.formas).filter(([k, f]) => f.qtd || k === "dinheiro");
      const m = modal(`<h3 style="font-size:18px;">Fechar caixa #${caixa.numero}</h3>
        <p class="cx-hint" style="margin:4px 0 12px;">Confira cada forma: conte o dinheiro da gaveta e compare cartão e Pix com o relatório da maquininha e o extrato. Deixe em branco o que não conferiu.</p>
        <div class="cx-fecha" style="margin-bottom:6px;"><span class="h">Forma</span><span class="h d" style="text-align:right;">Esperado</span><span class="h" style="text-align:right;">Conferido</span><span class="h" style="text-align:right;">Diferença</span></div>
        ${linhas.map(([k, f]) => `<div class="cx-fecha" style="margin-bottom:8px;"><span>${k === "dinheiro" ? "Dinheiro na gaveta" : FORMAS_CAIXA[k]}</span>
          <span class="cx-num d">${brl(k === "dinheiro" ? r.dinheiroGaveta : f.valor)}</span>
          <input type="number" step="0.01" min="0" data-f="${k}" placeholder="${(k === "dinheiro" ? r.dinheiroGaveta : f.valor).toFixed(2)}" />
          <span class="cx-num" data-d="${k}">-</span></div>`).join("")}
        <div class="field" style="margin-top:10px;"><label>Observação</label><input id="m-obs" placeholder="Ex.: diferença no troco de uma mesa" /></div>
        <div id="m-msg" class="form-msg"></div>
        <div class="modal-actions"><button class="btn btn-ghost" data-close>Voltar</button><button class="btn btn-primary" id="m-ok">Fechar caixa</button></div>`, { width: 600 });
      const esperadoDe = (k) => (k === "dinheiro" ? r.dinheiroGaveta : r.formas[k].valor);
      m.el.addEventListener("input", (e) => {
        const k = e.target.dataset.f; if (!k) return;
        const cel = m.el.querySelector(`[data-d="${k}"]`);
        if (e.target.value === "") { cel.textContent = "-"; cel.className = "cx-num"; return; }
        const d = Math.round((Number(e.target.value) - esperadoDe(k)) * 100) / 100;
        cel.textContent = d === 0 ? "ok" : brl(d); cel.className = `cx-num ${d > 0 ? "cx-pos" : d < 0 ? "cx-neg" : ""}`;
      });
      m.el.querySelector("#m-ok").addEventListener("click", async () => {
        const contado = {};
        m.el.querySelectorAll("[data-f]").forEach((i) => { if (i.value !== "") contado[i.dataset.f] = Number(i.value); });
        if (!("dinheiro" in contado) && !(await lumosConfirm("Você não conferiu o dinheiro da gaveta. Fechar mesmo assim?"))) return;
        const diferenca = Math.round(Object.entries(contado).reduce((t, [k, v]) => t + v - esperadoDe(k), 0) * 100) / 100;
        const esperado = { formas: r.formas, dinheiro_gaveta: r.dinheiroGaveta, sangrias: r.sangrias, suprimentos: r.suprimentos, valor_inicial: Number(caixa.valor_inicial), qtd_vendas: r.qtdVendas, total_vendas: r.totalVendas };
        const { error } = await supabase.from("caixas").update({
          status: "fechado", fechado_em: new Date().toISOString(), fechado_por: eu.id, fechado_por_nome: eu.nome,
          esperado, contado, diferenca, observacao: m.el.querySelector("#m-obs").value.trim() || null,
        }).eq("id", caixa.id).eq("status", "aberto");
        if (error) { m.el.querySelector("#m-msg").textContent = error.message; m.el.querySelector("#m-msg").className = "form-msg error"; return; }
        const id = caixa.id;
        m.close(); await load();
        relatorio(window.__hist.find((c) => c.id === id));
      });
    }

    // Relatório de fechamento (para imprimir ou salvar em PDF)
    function relatorio(c) {
      if (!c) return;
      const e = c.esperado || {}, ct = c.contado || {};
      const linhas = Object.entries(e.formas || {}).filter(([k, f]) => f.qtd || k === "dinheiro").map(([k, f]) => {
        const esp = k === "dinheiro" ? Number(e.dinheiro_gaveta || 0) : Number(f.valor || 0);
        const conf = k in ct ? Number(ct[k]) : null;
        return `<tr><td>${k === "dinheiro" ? "Dinheiro na gaveta" : FORMAS_CAIXA[k]}</td><td class="n">${f.qtd || 0}</td><td class="n">${brl(f.valor)}</td><td class="n">${brl(esp)}</td><td class="n">${conf == null ? "não conferido" : brl(conf)}</td><td class="n">${conf == null ? "-" : brl(conf - esp)}</td></tr>`;
      }).join("");
      const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fechamento do caixa #${c.numero}</title>
        <style>body{font-family:Arial,sans-serif;color:#111;margin:24px;font-size:13px}h1{font-size:18px;margin:0 0 4px}p{margin:2px 0}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border-bottom:1px solid #ddd;padding:6px 4px;text-align:left}.n{text-align:right}.t td{font-weight:700}</style></head><body>
        <h1>Fechamento do caixa #${c.numero}</h1>
        <p>Aberto em ${hora(c.aberto_em)} por ${esc(c.aberto_por_nome || "-")} | Fechado em ${hora(c.fechado_em)} por ${esc(c.fechado_por_nome || "-")}</p>
        <p>Fundo de troco: ${brl(e.valor_inicial)} | Suprimentos: ${brl(e.suprimentos)} | Sangrias: ${brl(e.sangrias)} | Vendas: ${e.qtd_vendas || 0} (${brl(e.total_vendas)})</p>
        <table><thead><tr><th>Forma</th><th class="n">Vendas</th><th class="n">Vendido</th><th class="n">Esperado</th><th class="n">Conferido</th><th class="n">Diferença</th></tr></thead><tbody>${linhas}
        <tr class="t"><td colspan="5">Diferença total</td><td class="n">${brl(c.diferenca || 0)}</td></tr></tbody></table>
        ${c.observacao ? `<p style="margin-top:12px;">Observação: ${esc(c.observacao)}</p>` : ""}
        <p style="margin-top:40px;">______________________________<br>Assinatura do operador</p>
        <script>window.onload=()=>window.print()<\/script></body></html>`;
      const w = window.open("", "_blank");
      if (!w) return lumosAlert("O navegador bloqueou a janela do relatório. Permita janelas para este site.");
      w.document.write(html); w.document.close();
    }
    $("hist").addEventListener("click", (e) => { const b = e.target.closest("[data-rel]"); if (b) relatorio(window.__hist.find((c) => c.id === b.dataset.rel)); });

    await load();

    // ================= Simulação para apresentação (só administração) =================
    // O caixa do turno é fictício e existe só na tela: nada é gravado no banco.
    {
      const { botaoSimular, destacar } = await import("./js/simulacao.js?v=87");
      const agora = Date.now();
      const VENDAS = [["pix", 94.6], ["dinheiro", 80], ["credito", 120], ["dinheiro", 45], ["debito", 62.5]].map(([metodo, v]) => ({ pagamento: { metodo, valor_cobrado: v } }));
      const SANGRIA = { tipo: "sangria", valor: 100, motivo: "cofre", por_nome: "Carla (caixa)", created_at: new Date(agora - 3600e3).toISOString() };
      function estado(aberto, comMovs) {
        caixa = aberto ? { id: "sim", numero: 12, status: "aberto", aberto_em: new Date(agora - 4 * 3600e3).toISOString(), aberto_por_nome: "Carla (caixa)", valor_inicial: 150 } : null;
        movs = comMovs ? [SANGRIA] : [];
        vendas = aberto ? VENDAS : [];
        resumo = aberto ? resumoCaixa({ valorInicial: 150, vendas, movs }) : null;
        renderAtual();
        const box = $("atual");
        box.style.pointerEvents = "none";
        box.querySelector(".cx-card")?.insertAdjacentHTML("afterbegin", `<span class="sim-mark">Simulação</span>`);
        if (!aberto) { const i = box.querySelector("#a-ini"); if (i) i.value = "150"; }
        return box.querySelector(".cx-card");
      }
      function fechamentoFicticio() {
        document.getElementById("sim-fecha")?.remove();
        const r = resumoCaixa({ valorInicial: 150, vendas: VENDAS, movs: [SANGRIA] });
        const linhas = [["Dinheiro na gaveta", r.dinheiroGaveta, r.dinheiroGaveta - 2], ["Pix", r.formas.pix.valor, r.formas.pix.valor], ["Cartão de crédito", r.formas.credito.valor, r.formas.credito.valor], ["Cartão de débito", r.formas.debito.valor, r.formas.debito.valor]];
        const el = document.createElement("div");
        el.id = "sim-fecha"; el.className = "modal-backdrop";
        el.style.cssText = "display:flex; z-index:940; align-items:flex-start; padding-top:5vh;";
        el.innerHTML = `<div class="modal-box" style="max-width:600px; width:100%; pointer-events:none;">
          <span class="sim-mark">Simulação</span>
          <h3 style="font-size:18px; margin-top:6px;">Fechar caixa #12</h3>
          <p class="cx-hint" style="margin:4px 0 12px;">Confira cada forma: conte o dinheiro da gaveta e compare cartão e Pix com o relatório da maquininha e o extrato.</p>
          <div class="cx-fecha" style="margin-bottom:6px;"><span class="h">Forma</span><span class="h d" style="text-align:right;">Esperado</span><span class="h" style="text-align:right;">Conferido</span><span class="h" style="text-align:right;">Diferença</span></div>
          ${linhas.map(([n, e, c]) => { const d = Math.round((c - e) * 100) / 100; return `<div class="cx-fecha" style="margin-bottom:8px;"><span>${n}</span><span class="cx-num d">${brl(e)}</span><input value="${c.toFixed(2)}" /><span class="cx-num ${d < 0 ? "cx-neg" : ""}">${d === 0 ? "ok" : brl(d)}</span></div>`; }).join("")}
          <div class="field" style="margin-top:10px;"><label>Observação</label><input value="Troco errado em uma mesa" /></div>
          <div class="modal-actions"><button class="btn btn-ghost">Voltar</button><button class="btn btn-primary">Fechar caixa</button></div></div>`;
        document.body.appendChild(el);
      }
      const tirarFechamento = () => document.getElementById("sim-fecha")?.remove();
      botaoSimular(() => ({
        titulo: "Caixa: do troco da abertura até a conferência do fechamento",
        antes: "Toda conta paga no Lumos (mesa, delivery, retirada ou WhatsApp) entra no caixa aberto, já separada pela forma de pagamento.",
        faz: "Abre o turno com o fundo de troco, registra sangrias e suprimentos, mostra quanto deveria ter na gaveta e confere cada forma no fechamento.",
        depois: "O fechamento vira um registro que ninguém altera, com relatório para imprimir e assinar. As vendas seguem para o Financeiro e a Contabilidade.",
        passos: [
          { titulo: "Abrindo o caixa", acao: () => destacar(estado(false)),
            texto: "Começo do turno: a Carla, do caixa, abre o caixa informando os R$ 150,00 de troco que ficam na gaveta. Só existe um caixa aberto por vez." },
          { titulo: "As vendas entram sozinhas", acao: () => destacar(estado(true, false)),
            texto: "Cada conta paga entra no caixa sozinha, separada por forma de pagamento. A conta do Adalberto, R$ 94,60 no Pix, já está aqui. Ninguém digita valor nenhum." },
          { titulo: "Sangria", acao: () => destacar(estado(true, true)),
            texto: "No meio do turno, a Carla tirou R$ 100,00 da gaveta e levou para o cofre. Ela registra a sangria e o sistema já recalcula quanto deveria ter na gaveta: R$ 175,00." },
          { titulo: "Fechamento conferido", acao: () => fechamentoFicticio(),
            texto: "No fechamento, ela conta o dinheiro e confere cartão e Pix com a maquininha e o extrato. Faltaram R$ 2,00 na gaveta: a diferença aparece na hora, com a observação de onde veio." },
          { titulo: "Registro que não muda", acao: () => { tirarFechamento(); const c = estado(false); destacar(c);
              $("hist").insertAdjacentHTML("afterbegin", `<tr class="cr-simrow" data-sim-hist><td>#12 <span class="sim-mark">Simulação</span></td><td>hoje, 18:00</td><td>hoje, 23:40</td><td>Carla (caixa)</td><td class="cx-num">${brl(402.1)}</td><td class="cx-num cx-neg">${brl(-2)}</td><td></td></tr>`); },
            texto: "Caixa fechado vira registro: nem o dono consegue alterar depois. O histórico mostra cada turno com a diferença, e o relatório sai pronto para imprimir e assinar. Assim o dono sabe exatamente o que aconteceu em cada turno." },
        ],
        limpar: () => { tirarFechamento(); $("hist").querySelector("[data-sim-hist]")?.remove(); $("atual").style.pointerEvents = ""; load(); },
      }));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozinha — Lumos</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <script src="js/logo.js" defer></script>
  <link rel="stylesheet" href="css/styles.css?v=21" />
</head>
<body>

  <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>

  <div class="luzes luzes--panel" aria-hidden="true">
    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
  </div>

  <div class="dash-shell">
    <aside class="dash-side">
      <div class="logo">
        <img src="img/logo.png" class="logo-mark" alt="Lumos">
        Lumos
      </div>
      <nav class="dash-nav" id="dash-nav"></nav>
      <button class="theme-toggle-btn" id="theme-toggle-btn">
        <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"></svg>
        <span id="theme-toggle-label">Modo escuro</span>
      </button>
    </aside>

    <main class="dash-main">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
        <div>
          <h1 style="font-size: 28px;">Cozinha</h1>
          <p style="margin-top: 6px;">Cada card é um pedido. Arraste pra "Entregue" quando sair da cozinha.</p>
        </div>
        <button class="btn btn-primary" id="new-order-btn">+ Novo pedido</button>
      </div>

      <div class="kanban-board" id="orders-board" style="margin-top:24px;"></div>
    </main>
  </div>

  <!-- Modal: novo pedido manual -->
  <div class="modal-backdrop" id="new-order-modal" style="display:none;">
    <div class="modal-box" style="max-width:460px;">
      <h3 style="font-family: var(--panel-font-display); font-size: 18px;">Novo pedido</h3>

      <div class="detail-field" style="margin-top:16px;">
        <div class="k">Cliente (mesa ativa)</div>
        <select class="panel-select" id="order-lead" style="width:100%;"></select>
      </div>

      <div class="detail-field">
        <div class="k">Itens</div>
        <div id="order-items-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button type="button" class="btn btn-ghost" id="add-item-row" style="margin-top:8px;">+ Adicionar item</button>
      </div>

      <div id="new-order-msg" class="form-msg"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="new-order-cancel">Cancelar</button>
        <button class="btn btn-primary" id="new-order-confirm">Criar pedido</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js";
    import { initThemeToggle } from "./js/theme.js";
    import { initMobileNav } from "./js/mobileNav.js";
    import { renderSidebar } from "./js/sidebar.js";
    import { supabase } from "./js/supabaseClient.js";
    import { listOrders, updateOrderStatus, createOrder, ORDER_STATUS_LABELS } from "./js/orders.js";
    import { listTables, getActiveSession, listSessionLeads } from "./js/tables.js";

    await requireSession();
    initThemeToggle();
    await renderSidebar("cozinha");
    initMobileNav();
    document.getElementById("logout-link").addEventListener("click", (e) => {
      e.preventDefault();
      signOut();
    });

    const STATUSES = ["novo_pedido", "entregue"];
    const board = document.getElementById("orders-board");

    async function loadBoard() {
      const orders = await listOrders();

      board.innerHTML = STATUSES.map((status) => `
        <div class="kanban-col" style="width:320px;" data-status="${status}">
          <div class="kanban-col-header">
            <h4>${ORDER_STATUS_LABELS[status]} <span class="kanban-count">${orders.filter((o) => o.status === status).length}</span></h4>
          </div>
          <div class="kanban-col-body" data-status="${status}"></div>
        </div>
      `).join("");

      orders.forEach((order) => {
        const body = board.querySelector(`.kanban-col-body[data-status="${order.status}"]`);
        if (!body) return;
        const card = document.createElement("div");
        card.className = "kanban-card";
        card.draggable = true;
        card.dataset.id = order.id;
        card.dataset.status = order.status;
        const itemsHtml = (order.order_items || [])
          .map((it) => `${it.quantity}x ${it.product_name} — R$ ${Number(it.unit_price * it.quantity).toFixed(2)}`)
          .join("<br>");
        card.innerHTML = `
          <div class="name">${order.leads?.name || order.leads?.phone || "Cliente"}</div>
          <div class="reason">${itemsHtml}</div>
          <div class="date">Total: R$ ${Number(order.total).toFixed(2)}</div>
        `;
        card.addEventListener("dragstart", () => card.classList.add("dragging"));
        card.addEventListener("dragend", () => card.classList.remove("dragging"));
        body.appendChild(card);
      });

      board.querySelectorAll(".kanban-col-body").forEach((colBody) => {
        colBody.addEventListener("dragover", (e) => { e.preventDefault(); colBody.classList.add("drag-over"); });
        colBody.addEventListener("dragleave", () => colBody.classList.remove("drag-over"));
        colBody.addEventListener("drop", async (e) => {
          e.preventDefault();
          colBody.classList.remove("drag-over");
          const dragging = board.querySelector(".dragging");
          if (!dragging) return;
          const newStatus = colBody.dataset.status;
          if (dragging.dataset.status === newStatus) return;
          await updateOrderStatus(dragging.dataset.id, newStatus);
          loadBoard();
        });
      });
    }

    // ---------- Novo pedido manual ----------
    let productsCache = [];
    let leadSessionMap = {}; // lead_id -> table_session_id

    document.getElementById("new-order-btn").addEventListener("click", async () => {
      const tables = await listTables();
      const leadOptions = [];
      leadSessionMap = {};

      for (const t of tables) {
        const session = await getActiveSession(t.id);
        if (!session) continue;
        const leads = await listSessionLeads(session.id);
        leads.forEach((l) => {
          leadOptions.push(`<option value="${l.id}">${t.label} — ${l.name || l.phone}</option>`);
          leadSessionMap[l.id] = session.id;
        });
      }

      const leadSelect = document.getElementById("order-lead");
      leadSelect.innerHTML = leadOptions.length ? leadOptions.join("") : `<option value="">Nenhum cliente sentado em nenhuma mesa</option>`;

      const { data: products } = await supabase.from("products").select("*").eq("active", true);
      productsCache = products || [];

      document.getElementById("order-items-list").innerHTML = "";
      addItemRow();
      document.getElementById("new-order-msg").textContent = "";
      document.getElementById("new-order-modal").style.display = "flex";
    });

    function addItemRow() {
      const row = document.createElement("div");
      row.className = "item-row";
      row.style.cssText = "display:flex; gap:8px; align-items:center;";
      row.innerHTML = `
        <select class="panel-select item-product" style="flex:1;">
          ${productsCache.map((p) => `<option value="${p.id}" data-price="${p.price}">${p.name} (R$ ${Number(p.price).toFixed(2)})</option>`).join("")}
        </select>
        <input type="number" class="panel-select item-qty" value="1" min="1" style="width:60px;" />
        <button type="button" class="btn btn-ghost btn-sm remove-item-row">✕</button>
      `;
      row.querySelector(".remove-item-row").addEventListener("click", () => row.remove());
      document.getElementById("order-items-list").appendChild(row);
    }

    document.getElementById("add-item-row").addEventListener("click", addItemRow);

    document.getElementById("new-order-cancel").addEventListener("click", () => {
      document.getElementById("new-order-modal").style.display = "none";
    });

    document.getElementById("new-order-confirm").addEventListener("click", async () => {
      const msg = document.getElementById("new-order-msg");
      const lead_id = document.getElementById("order-lead").value;
      const table_session_id = leadSessionMap[lead_id];

      if (!lead_id || !table_session_id) {
        msg.textContent = "Escolha um cliente com mesa ativa.";
        msg.className = "form-msg error";
        return;
      }

      const items = [...document.querySelectorAll(".item-row")].map((row) => {
        const select = row.querySelector(".item-product");
        const product = productsCache.find((p) => p.id === select.value);
        return {
          product_id: product?.id,
          product_name: product?.name || "Item",
          unit_price: Number(select.selectedOptions[0]?.dataset.price || 0),
          quantity: parseInt(row.querySelector(".item-qty").value) || 1,
        };
      });

      if (!items.length) {
        msg.textContent = "Adicione pelo menos um item.";
        msg.className = "form-msg error";
        return;
      }

      const { error } = await createOrder({ table_session_id, lead_id, items });
      if (error) {
        msg.textContent = `Erro: ${error.message}`;
        msg.className = "form-msg error";
        return;
      }
      document.getElementById("new-order-modal").style.display = "none";
      loadBoard();
    });

    loadBoard();
  </script>

</body>
</html>

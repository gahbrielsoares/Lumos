<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow Up — Lumos</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <script src="js/logo.js?v=28" defer></script>
  <link rel="stylesheet" href="css/styles.css?v=28" />
</head>
<body>

  <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
    <div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>

  <div class="luzes luzes--panel" aria-hidden="true">
    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
  </div>

<div class="dash-shell">
    <aside class="dash-side">
      <div class="logo">
        <img src="img/logo.png" class="logo-mark" alt="Lumos">
        Lumos
      </div>
      <nav class="dash-nav" id="dash-nav"></nav>
      <button class="theme-toggle-btn" id="theme-toggle-btn">
        <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"></svg>
        <span id="theme-toggle-label">Modo escuro</span>
      </button>
    </aside>

    <main class="dash-main">
      <h1 style="font-size: 28px;">Follow Up</h1>
      <p style="margin-top: 6px;">Leads que precisam de acompanhamento. O Agente de IA faz o follow up automaticamente.</p>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn" data-range="hoje">Hoje</button>
        <button class="filter-btn" data-range="ontem">Ontem</button>
        <button class="filter-btn active" data-range="7d">Últimos 7 dias</button>
        <button class="filter-btn" data-range="14d">Últimos 14 dias</button>
        <button class="filter-btn" data-range="mes">Este mês</button>
        <button class="filter-btn" data-range="mes_passado">Mês passado</button>
        <button class="filter-btn" data-range="ano">Este ano</button>
      </div>

      <div style="display:flex; align-items:center; gap:10px; margin-top:14px;">
        <label style="font-size:13px; color:var(--panel-text-muted);">Agente:</label>
        <select class="panel-select" id="agent-filter" style="min-width:220px;">
          <option value="">Todos os agentes</option>
        </select>
      </div>

      <div class="panel-table-wrap">
        <table class="panel-table">
          <thead>
            <tr><th>Início do Atendimento</th><th>Nome</th><th>WhatsApp</th><th>Motivo do Contato</th><th>Status</th><th>Última Mensagem</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div class="empty-state" id="table-empty" style="display:none; border:none; border-radius:0;">
          <h3>Nada pendente de follow up</h3>
          <p>Assim que um lead precisar de acompanhamento, ele aparece aqui.</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireSession, signOut } from "./js/auth.js?v=28";
    import { initThemeToggle } from "./js/theme.js?v=28";
    import { initMobileNav } from "./js/mobileNav.js?v=28";
    import { renderSidebar } from "./js/sidebar.js?v=28";
    import { getRange } from "./js/dateRange.js?v=28";
    import { supabase } from "./js/supabaseClient.js?v=28";
    import { STAGE_LABELS, getLatestMessage } from "./js/leads.js?v=28";
    import { listAgents } from "./js/agents.js?v=28";

    await requireSession();
    initThemeToggle();
    await renderSidebar("follow_up");
    initMobileNav();
    document.getElementById("logout-link").addEventListener("click", (e) => {
      e.preventDefault();
      signOut();
    });

    async function loadList(rangeKey) {
      const agentId = document.getElementById("agent-filter").value;
      const [start, end] = getRange(rangeKey);
      let query = supabase
        .from("leads")
        .select("*")
        .eq("stage", "follow_up")
        .gte("created_at", start.toISOString())
        .lt("created_at", end.toISOString())
        .order("created_at", { ascending: false });
      if (agentId) query = query.eq("agent_id", agentId);
      const { data: leads } = await query;

      const body = document.getElementById("table-body");
      const empty = document.getElementById("table-empty");

      if (!leads?.length) {
        body.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      const rows = await Promise.all(leads.map(async (l) => {
        const latest = await getLatestMessage(l.id);
        return `
          <tr onclick="window.location.href='leads.html?id=${l.id}'">
            <td>${new Date(l.created_at).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}</td>
            <td>${l.name || "—"}</td>
            <td>${l.phone}</td>
            <td>${l.motivo_contato || "—"}</td>
            <td><span class="panel-badge ${l.stage}">${STAGE_LABELS[l.stage]}</span></td>
            <td>${latest?.text || "—"}</td>
          </tr>
        `;
      }));
      body.innerHTML = rows.join("");
    }

    (async () => {
      const agents = await listAgents();
      const select = document.getElementById("agent-filter");
      agents.forEach((a) => {
        const opt = document.createElement("option");
        opt.value = a.id;
        opt.textContent = a.name || a.phone_number || "Agente";
        select.appendChild(opt);
      });
    })();

    document.getElementById("agent-filter").addEventListener("change", () => {
      const active = document.querySelector(".filter-btn.active");
      loadList(active ? active.dataset.range : "7d");
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        loadList(btn.dataset.range);
      });
    });

    loadList("7d");
  </script>

</body>
</html>
